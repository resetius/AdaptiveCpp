name: macOS Metal backend

# TEMPORARY: this workflow only runs the Metal feature probe, so that a result
# comes back in a minute. The build and the test steps are in git history.
on:
  push:
  pull_request:

jobs:
  build_metal:
    name: Metal backend [macOS, LLVM 20]
    # macos-26 is specified explicitly: as of early 2026 it is in public preview
    # on GitHub Actions and is not yet selected by 'macos-latest'. We need it
    # because metal-cpp requires macOS 26 SDK (MTL::LanguageVersion4_0 etc.).
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7

    - name: probe Metal features
      run: |
        cd ${GITHUB_WORKSPACE}/ci-probe
        clang -fobjc-arc -framework Metal -framework Foundation -O2 -o features features.m
        ./features prologue_with_buf2.metal prologue_without_buf2.metal gen_a32.msl v_a32_nobuf2.msl atomic64_kernel.msl
