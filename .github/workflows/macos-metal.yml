name: macOS Metal backend

on:
  # TEMPORARY: not limited to develop, so that this branch is tested too
  push:
  pull_request:

jobs:
  build_metal:
    name: Metal backend [macOS, LLVM 20]
    # macos-26 is specified explicitly: as of early 2026 it is in public preview
    # on GitHub Actions and is not yet selected by 'macos-latest'. We need it
    # because metal-cpp requires macOS 26 SDK (MTL::LanguageVersion4_0 etc.).
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    # TEMPORARY: only the vote diagnostics, the build is in git history
    - name: probe SIMD votes
      run: |
        cd ${GITHUB_WORKSPACE}/ci-probe
        clang -fobjc-arc -framework Metal -framework Foundation -O2 -o run_diag run_diag.m
        ./run_diag 32 32
        ./run_diag 256 256
        ./run_diag 2048 256
